- aid: cvent-event-cloud:cvent-event-cloud-appointments-api
  name: Cvent Event Cloud Appointments API
  description: >-
    An appointment is a meeting scheduled between two or more parties. These APIs allow you to get
     information about your Cvent Appointments: appointment attendees, their interests, and availabilities.


    * **Appointment Events** - Appointment events help planners facilitate meetings between attendees.
    Attendees express their interest and availability to schedule appointments. Use this API to get information
    about appointments and appointment attendees.


    * **Appointment Attendees** - Appointment attendees are meeting participants. They can be attendees
    of either events or appointment events. Get information about these participants or use their appointment
    attendee ID to get their availabilities and interests.


    * **Availability** - Appointment availabilities describe an appointment attendees' preference in meeting
    dates and times. Availability information is only available for *Planner Coordinated Appointments*.


    * **Interests** - Appointment interests describe appointment attendees' preferences in meeting with
    another organization or individual. Interest information is only available for *Planner Coordinated
    Appointments*.

    * **Available Times** - Available times lists time ranges available  for appointments scheduling.

    * **Locations** - Locations lists details of all locations created for  scheduling appointments.

    * **Appointment Types** - Appointment Types lists details of different  appointment types created.
  humanURL: https://developers.cvent.com/docs/rest-api/overview
  baseURL: https://api-platform.cvent.com
  tags:
  - Appointments
  properties:
  - type: OpenAPI
    url: openapi/cvent-event-cloud-appointments-api-openapi.yml
  - type: Postman
    url: collections/cvent-event-cloud-appointments-api.postman_collection.json
  - type: OpenCollection
    url: collections/cvent-event-cloud-appointments-api.opencollection.json
- aid: cvent-event-cloud:cvent-event-cloud-attendee-activities-api
  name: Cvent Event Cloud Attendee Activities API
  description: >-
    The Attendee Activities API gives valuable insight into your customer's experience at your Cvent event.

    Now, you can get a fuller picture of your customer's journey, including onsite activities, offsite
    meetings,

    breakout sessions, booth visits, and virtual seminars. You can use that data to compile a unified
    customer

    profile that integrates with your external systems and data.


    By gathering all this info into a single interface, the API allows you to see your customer's engagement

    at every step of the journey, create engagement models, and integrate that data with your external
    tools.

    You can use this data to understand what your customers are looking for, keep them engaged, build
    loyalty,

    drive upsell, and increase the long-term value of your events.


    Please note that attendee activities data is retained for a maximum of 2 years and is purged thereafter.


    For more details on [attendee activities](https://developers.cvent.com/docs/rest-api/explanation/attendee-activities).
  humanURL: https://developers.cvent.com/docs/rest-api/overview
  baseURL: https://api-platform.cvent.com
