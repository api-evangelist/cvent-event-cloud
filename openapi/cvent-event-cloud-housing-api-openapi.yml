    housingReservationsFilter:
      name: filter
      in: query
      required: false
      description: '"A filter query string narrows search results and supports the combination of logical and comparison operators. The filter adheres to the pattern filter=''field'' comparisonType ''value''."


        These are the comparison types that can be used in filter expressions:

        * equal: eq


        The following fields are filterable:

        * attendeeType.id (eq)

        * hotel.id (eq)


        The following operators are available:

        * and

        * or

        '
      schema:
        type: string
        example: attendeeType.id eq 10345 and hotel.id eq 11355
    reservationRequestsId:
      in: path
      name: reservationRequestsId
      description: Unique room reservation request ID.
      required: true
      schema:
        type: string
      example: D6A63423-G796
    paginationParam:
      name: token
      in: query
      description: 'The continuation token returned from a previous class. This must be a valid UUID v4 if provided.

        This will override any other pageable parameters provided.

        '
      style: form
      explode: true
      schema:
        type: string
        example: 0e28af57-511f-47ab-ae46-46cd1ca51a1a
    limitParam:
      in: query
      name: limit
      description: Limit to this number of search results. Maximum of 200, default of 100.
      required: false
      example: '10'
      schema:
        type: integer
        maximum: 200
        minimum: 1
        default: 100
    housingEventsSummariesFilter:
      name: filter
      in: query
      required: false
      description: 'A filter query string narrows search results. If the parameter is not specified, future housing events will be returned.


        The filter supports the combination of logical and comparison operators, adheres to the pattern filter=''field'' comparisonType ''value''.


        These are the comparison types that can be used in filter expressions:

        * equal: eq

        * greater than: gt

        * less than: lt

        * greater or equal: ge

        * less than or equal: le


        The following fields are filterable:

        * start (eq|le|ge|lt|gt)

        * end (eq|le|ge|lt|gt)


        The following operators are available:

        * and

        * or

        '
      schema:
        type: string
        example: (start ge '2027-01-11T05:00:00.000Z' and end le '2027-01-15T05:00:00.000Z') or (end eq '2027-02-01T05:00:00.000Z')
    after:
      name: after
      required: false
      description: Used to query records that have been added or updated after this time point. Default to the beginning of time of the data store.
      in: query
      schema:
        type: string
        format: date-time
        example: '2017-01-02T02:00:00Z'
    availableNightsFilter:
      name: filter
      in: query
      required: false
      description: '"A filter query string narrows search results and supports the combination of logical and comparison operators. The filter adheres to the pattern filter=''field'' comparisonType ''value''."


        These are the comparison types that can be used in filter expressions:

        * equal: eq

        * less or equal: le

        * greater or equal: ge

        * greater than: gt

        * less than: lt


        The following fields are filterable:

        * attendeeType.codes (eq)

        * attendeeType.id (eq)

        * roomType.id (eq)

        * date (eq|le|ge|lt|gt)


        Limits for the number of fields that can be passed in a filter: 36


        The following operators are available:

        * and

        * or

        '
      schema:
        type: string
        example: attendeeType.codes eq 'PEWATT0524317' and (date ge '2023-01-12' and date le '2023-01-15')
    availabilityLimit:
      in: query
      name: limit
      description: Limit to this number of search results. Maximum of 50, default of 10.
      required: false
      example: 10
      schema:
        type: integer
        maximum: 50
        minimum: 1
        default: 10
    reservationId:
      in: path
      name: reservationId
      description: Cvent Passkey confirmation number.
      required: true
      schema:
        type: string
      example: 327S856H
    hotelId1:
      in: path
      name: hotelId
      description: The hotel's unique ID.
      required: true
      schema:
        type: integer
      example: 454345
    inventoryFilter:
      name: filter
      in: query
      required: false
      description: '"A filter query string narrows search results and supports the combination of logical and comparison operators. The filter adheres to the pattern filter=''field'' comparisonType ''value''. If the parameter is not specified, all inventory dates will be returned."


        These are the comparison types that can be used in filter expressions:

        * equal: eq

        * greater than: gt

        * less than: lt

        * greater or equal: ge

        * less than or equal: le


        The following fields are filterable:


        * date (eq|le|ge|lt|gt)


        Limits for the number of fields that can be passed in a filter: 18


        The following operators are available:

        * and

        * or

        '
      schema:
        type: string
        example: (date ge '2023-01-12' and date le '2023-01-15') or (date eq '2023-02-01')
    housingEventId:
