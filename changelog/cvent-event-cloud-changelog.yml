description: >-
  Cvent publishes a dated, sectioned REST API changelog going back to September 2022. Releases land
  on a roughly biweekly cadence and are titled by the calendar days the change shipped rather than
  by a semantic version, because the API itself carries a single stable URI version (`ea`).
