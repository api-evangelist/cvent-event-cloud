gaps:
  - no_5xx_declared: >-
      Not one of the 458 operations declares a 5xx response. Cvent's servers certainly return them;
      the contract simply does not describe them, so a generated client has no typed handling for a
      500 or a 503.
  - no_retry_after: >-
      Cvent returns no Retry-After header on 429. The client must compute back-off itself from the
      X-RateLimit-Reset epoch or from Cvent's published back-off recipe.
  - no_error_code_vocabulary: >-
      There is no stable machine-readable error identifier beyond the HTTP status. `code` is the
      HTTP status repeated as an integer, and `message` is prose. Clients cannot branch on a
      symbolic error code.

