problem_types:
  - status: 400
    title: Bad request
    occurrences: 366
    meaning: >-
      Malformed request — an invalid query parameter, an unparseable filter expression, or a body
      that fails schema validation.
    remediation: >-
      Read `details[]` for the field-level causes. Validate filter syntax against
      https://developers.cvent.com/docs/rest-api/reference/filters before retrying; the request
      will fail identically until the input changes.
    retryable: false
  - status: 401
    title: Unauthorized
    spec_description: Bad or expired token
    occurrences: 457
    meaning: >-
      Missing, malformed or expired bearer token. Cvent access tokens expire after 3600 seconds.
    remediation: >-
      Request a fresh token from POST /ea/oauth2/token using HTTP Basic client credentials, then
      retry. Do not retry with the same token.
    retryable: true
    retry_after_reauth: true
  - status: 403
    title: Forbidden
    spec_description: You do not have access to the resource
    occurrences: 456
    meaning: >-
      The token is valid but the application was not granted the OAuth scope the operation requires,
      or the account does not have the product entitlement behind that resource.
    remediation: >-
      Compare the operation's declared scopes in scopes/cvent-event-cloud-scopes.yml against the
      scopes assigned to the application in the Cvent developer console. A 403 is a provisioning
      problem, never a transient one.
    retryable: false
  - status: 404
    title: Not Found
    spec_description: Resource not found
    occurrences: 345
    meaning: The addressed resource does not exist, or is not visible to this account.
    remediation: Verify the identifier and the region host — a record in the EMEA data centre is not visible on the North American host.
    retryable: false
  - status: 409
    title: Conflict
    spec_description: The request conflicts with current state of the target resource
    occurrences: 16
    meaning: Optimistic-concurrency or state conflict, e.g. writing a program item document that already exists.
    remediation: Re-read the resource, reconcile, and re-submit.
    retryable: false
  - status: 422
    title: Unprocessable Entity
    spec_description: Was not able to process the request.
    occurrences: 9
    meaning: Syntactically valid request that violates a business rule.
    remediation: Read `details[]`; the violated rule is named there.
    retryable: false
  - status: 429
    title: Too Many Requests
    occurrences: 456
    meaning: >-
      Either the per-second rate limit or the daily quota for the account's usage tier has been
      exceeded. Cvent's guide notes the message distinguishes the two: "Limit Exceeded" for the
      daily quota, "Too Many Requests" for the per-second rate.
    remediation: >-
      For a daily-quota 429, stop and wait until after midnight UTC — retrying will not succeed and
      every request, including the ones that 429, still counts against the quota. For a per-second
      429, back off exponentially: wait 2 seconds plus 1–1000 ms of jitter, double each attempt to a
      16-second ceiling, and give up after five attempts.
    retryable: true
