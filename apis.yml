aid: cvent-event-cloud
name: Cvent Event Cloud
kind: company
description: >-
  Cvent Event Cloud is the event management product line of the Cvent
  Platform. It supports the full event lifecycle: event creation,
  registration, marketing, agenda and session management, mobile event
  apps, onsite check-in, virtual and hybrid event delivery via the
  Attendee Hub, surveys, and analytics. Cvent publishes its own OpenAPI
  specification in public git at github.com/cvent/rest-sdks
  (cvent-public-spec/openapi.yaml) — 346 paths, 458 operations, 1,302
  schemas — and generates its first-party TypeScript, .NET and Java SDKs
  from it with Speakeasy, applying five published OpenAPI Overlay 1.0.0
  documents in the process. Access is OAuth 2.0, client credentials for
  server-to-server and authorization code for planner administrators,
  with the token endpoint at api-platform.cvent.com/ea/oauth2/token and
  235 declared scopes. Regional bases split North America
  (api-platform.cvent.com/ea) from Europe (api-platform-eur.cvent.com/ea)
  with no cross-region read. Cvent also runs a live remote MCP server at
  mcp.cvent.com/mcp secured with OAuth 2.1 and PKCE, publishes a dated
  biweekly changelog, a 40-message webhook catalogue, SCIM 2.0 user
  provisioning, and a Custom Widgets browser SDK for embedding components
  in Cvent-hosted event pages.
