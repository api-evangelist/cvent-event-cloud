entries:
  - date: '2026-08-05'
    title: REST API Updates (August 5–6, 2026)
    sections: [Updated]
    breaking: false
    highlights:
      - surface: Budget
        change: >-
          Create Budget Item, Update Budget Item, List Event Budget Items and List Budget Items —
          the BudgetVendor schema's `vendor.type` now includes REPOSITE as a possible value,
          indicating a vendor sourced from Reposite. Additive enum value.
      - surface: Event Travel
        change: >-
          Get Air Actual — the air-actual-detail response now documents minItems 0 / maxItems 200
          on the attendee air-actuals collection and on AirActualDetail.airActualDetails.
      - surface: RFP Management
        change: >-
          Get RFP — new optional `preferredVenueIntegrations` field on RfpRequest, an array
          (maxItems 1) of VenueIntegrationType values CED | PASSKEY.
  - date: '2026-07-22'
    title: REST API Updates (July 22-23)
    sections: [Added, New APIs, New Tags, Updated]
    breaking: false
    highlights:
      - surface: Venue Profiles
        change: >-
          New endpoints — Update Venue Details (PUT /venues/{venueId}/details), Patch Venue Details,
          Get Venue Details Overview, Update Venue Facility, Patch Venue Facility.
      - surface: Venue Meeting Rooms
        change: >-
          New endpoints — Create Meeting Room (POST /venues/{venueId}/meeting-rooms), List Meeting
          Rooms Overviews, Update Meeting Room, Patch Meeting Room, Get Meeting Room Overview.
      - surface: tags
        change: Two new OpenAPI tags introduced — Venue Profiles and Venue Meeting Rooms.
      - surface: Travel RFPs
        change: >-
          List Travel Proposals, List/Get Travel Proposal Bid and Get Travel Proposal gained the
          business-travel/proposals:read and business-travel/bids:read OAuth2 scopes alongside the
          existing business-transient/* scopes. The bid-item-status-type enum value `not_available`
          was replaced with `not_offered` to match production behaviour — Cvent states
          `not_available` was never actually emitted by the service.
      - surface: Bulk
        change: >-
          List Bulk Job Result — documentation now warns that `failed` reflects only the target
          operation's top-level HTTP status, so a 207 Multi-Status shows failed=false even when
          individual items failed. Create Bulk Job — `name`, `mode` and `ttl` removed from
          `required` as a spec correction (they were never in properties).
      - surface: Events
        change: >-
          List Orders / List Order Items — `deleted` query parameter description clarified to
          "When true, includes soft-deleted records in the response. Defaults to false."
      - surface: Attendees
        change: >-
          List Attendees / Get Attendee — the `deprecated` marker was REMOVED from `unsubscribed`
          as a documentation correction; the field remains read-only and filterable.
      - surface: Events+ Hub
        change: List Events+ Hubs — new `websiteTheming` boolean on the Hub branding schema, default false.
  - date: '2026-07-07'
    title: REST API Updates (July 7–8, 2026)
    sections: [Updated]
    breaking: false
  - date: '2026-06-17'
    title: REST API Updates (June 17–18, 2026)
    sections: [Added, Updated]
    breaking: false
    highlights:
      - surface: Card Tokens
        change: >-
          New API — Create a Credit Card Token. Creates a short-lived, single-use token representing
          a credit card, valid for 3600 seconds, that replaces the card in other API methods. New
          OAuth 2.0 scope secure-ecommerce/card-tokens:write.
      - surface: Custom Fields
        change: >-
          Create Custom Field request body now includes the `active` property. Missing 404 response
          added to Create Custom Field Translation.
      - surface: Audience Segments
        change: >-
          Schema rename — `existing-audience-segment` became `audience-segment-response`, and
          `audience-segment-creation-type` became `existing-audience-segment-creation-type`.
  - date: '2026-06-03'
    title: REST API Updates (June 3–4, 2026)
    sections: [Added, Updated]
    breaking: false
    highlights:
      - surface: Surveys
        change: New API — Get Question Choices, returning all choices for a given event question.
      - surface: Appointments
        change: >-
          Missing 400 responses documented across nine list operations, missing 429 responses
          documented across seven, and a new `participants[].status` property on the appointment
          response body.
      - surface: Events
        change: >-
          The `filter` query parameter now supports `and` / `or` logical operators on List Orders,
          List Order Items, List Transactions and List Transaction Items.
