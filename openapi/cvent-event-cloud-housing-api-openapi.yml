            - false: The tax or fee will be added to the hotel nightly rate as a separate charge.'
          type: boolean
          example: false
        partOfDisplayRate:
          description: 'Indicates if the tax or fee is included in the displayed rate shown to the guest.


            - true: The tax or fee is included in the displayed rate as part of the room rate. (Displayed rate = base room rate + tax/fee.)

            - false: The tax or fee is listed separately at the end of the booking process. (Displayed rate is the room rate only.)'
