- aid: cvent-event-cloud:cvent-event-cloud-exhibitor-api
  name: Cvent Event Cloud Exhibitor API
  description: >-
    * **Exhibitor -** An exhibitor is an organization that is sponsoring or exhibiting at your event.
    This API allows you to get information about your exhibitors.


    * **Registration Pack -** Registration Pack provides capacities of different registration types allocated
    by the planner to a specific exhibitor.


    * **Exhibitor Questions -** Set of questions for an exhibitor.


    * **Exhibitor Answers -** Set of answers to exhibitor questions for an exhibitor.


    * **Exhibitor Categories -** Set of exhibitor categories for an event. Exhibitor Categories are used
    in Attendee Hub and Event App to differentiate exhibitors.


    * **Sponsorship Levels -** Sponsorship levels are defined by the planner. Use this API to get details
    of existing sponsorship levels defined within the event. To assign sponsorship levels to exhibitors,
    use the Exhibitor endpoints.
