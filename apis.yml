    In the portal, they are able to complete pre-event tasks, manage their team, purchase LeadCapture
    (if applicable), and download leads. Use this API to get details for existing admins, create new admins,
    and update admin details.


    * **Exhibitor Booth Staff -** Exhibitor booth staff is someone that manages the frontline of the exhibitor's
    booth onsite or virtually. Booth staff needs to be registered for the event in order to be associated
    with an exhibitor. Use this API to get details for the existing booth staff(s) for a specific exhibitor,
    associate new booth staff to the exhibitor, and delete the association of a booth staff if required.
