      - amount
      - amountType
      - frequency
      - partOfBaseRate
      - partOfDisplayRate
      properties:
        name:
          description: Name of the tax or fee.
          type: string
          example: State Tax
        amount:
          description: Amount or percentage value of the tax or fee.
          type: number
          example: 6
        amountType:
          description: Specifies if the amount is a fixed value or a percentage.
          type: string
          enum:
          - amount
          - percentage
          example: percentage
        frequency:
          description: 'Defines how often the tax or fee is applied.

            - per_guest: Applied per guest.

            - per_room: Applied per room.

            - per_night: Applied per night.

            - per_stay: Applied per stay.'
          type: string
          enum:
          - per_guest
          - per_room
          - per_night
          - per_stay
          example: per_room
        partOfBaseRate:
          description: 'Indicates if the tax or fee is included in the base room rate set by the hotel (before any taxes or fees are applied).


