specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Cvent Event Cloud
providerId: cvent-event-cloud
generated: '2026-08-13'
method: searched
source: https://www.cvent.com/en/event-management-software/cvent-pricing
sources:
  - https://www.cvent.com/en/event-management-software/cvent-pricing
  - https://github.com/cvent/rest-sdks/blob/main/cvent-public-spec/openapi.yaml
created: '2026-05-04'
modified: '2026-08-13'
supersedes: >-
  The 2026-05-04 bulk-sweep scaffold, which invented a Free / Professional / Enterprise ladder with
  placeholder quotas (1,000 and 100,000 requests per month) and "TBD" prices. Cvent publishes no
  such tiers. The API access tiers below are Cvent's real, published ones and they are quota tiers,
  not price tiers.
plan_count: 3
pricing_published: false
currency: null
note: >-
  Cvent publishes NO prices. Every path on the pricing page terminates in "Contact sales" or "Get a
  free quote", and the page is organised by product module rather than by priced tier. Cvent does
  discount for non-profits but states the rate is discussed with its team. What Cvent DOES publish
  is the API usage-tier ladder below — Free, Standard and Premium — which governs API access volume
  and is documented in the OpenAPI itself and self-discoverable at runtime via GET /ea/usage/tier.
  Which tier an account receives is set by its Cvent contract, not chosen at signup.

plans:
  - id: cvent-event-cloud-api-free
    name: Free
    type: usage-tier
    price: null
    price_published: false
    description: >-
      Entry API usage tier. Sufficient for evaluation and low-volume integration; a single sustained
      poll loop will exhaust it.
    entries:
      - label: Daily API Calls
        name: daily_calls
        type: quota
        metric: calls
        limit: 1000
        timeFrame: day
        reset: 00:00 GMT
      - label: Calls per Second
        name: call_rate
        type: rate
        metric: calls_per_second
        limit: 2
        timeFrame: second
      - label: Max Burst
        name: burst
        type: rate
        metric: calls
        limit: 1
    elements:
      - name: Cvent REST APIs
      - name: Public documentation
      - name: OpenAPI specification
      - name: First-party SDKs (TypeScript, .NET, Java)
  - id: cvent-event-cloud-api-standard
    name: Standard
    type: usage-tier
    price: null
    price_published: false
    description: Production API usage tier.
    entries:
      - label: Daily API Calls
        name: daily_calls
        type: quota
        metric: calls
        limit: 15000
        timeFrame: day
        reset: 00:00 GMT
      - label: Calls per Second
        name: call_rate
        type: rate
        metric: calls_per_second
        limit: 10
        timeFrame: second
      - label: Max Burst
        name: burst
        type: rate
        metric: calls
        limit: 10
    elements:
      - name: Cvent REST APIs
      - name: Webhooks
      - name: Bulk API
  - id: cvent-event-cloud-api-premium
    name: Premium
    type: usage-tier
    price: null
    price_published: false
    description: High-volume API usage tier.
    entries:
      - label: Daily API Calls
        name: daily_calls
        type: quota
        metric: calls
        limit: 500000
        timeFrame: day
        reset: 00:00 GMT
      - label: Calls per Second
        name: call_rate
        type: rate
        metric: calls_per_second
        limit: 25
        timeFrame: second
      - label: Max Burst
        name: burst
        type: rate
        metric: calls
        limit: 25
    elements:
      - name: Cvent REST APIs
      - name: Webhooks
      - name: Bulk API

tier_discovery:
  operation: getUsageTier
  method: GET
  path: /ea/usage/tier
  description: >-
    An account can read its own assigned usage tier at runtime. Cvent notes limits "may change as
    the Cvent API Platform evolves", so a client should read the tier rather than hard-code it.

product_pricing:
  model: quote-only
  url: https://www.cvent.com/en/event-management-software/cvent-pricing
  cta: [Contact sales, Get a free quote, Request demo]
  discounts:
    - audience: non-profit organizations
      published_rate: false
      note: Cvent states it extends special rates to non-profits, negotiated with its team.
  note: >-
    The apis.yml Pricing pointer previously read https://www.cvent.com/en/pricing, which returns
    HTTP 404. The live page is /en/event-management-software/cvent-pricing.

maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
