observations:
  - >-
    Not one 2026 release carries a Deprecated section. The most recent Deprecated sections are
    dated 2025-06-18, 2025-05-08, 2025-03-26, 2025-02-26 and 2025-02-12 — Cvent has removed nothing
    from the contract in more than a year.
  - >-
    A large share of entries are contract corrections rather than behaviour changes: undocumented
    400/404/429 responses being added to the spec, `required` lists being fixed, deprecation markers
    being withdrawn. That is a spec catching up with a service, and it is visible because Cvent
    versions the spec in public git.
  - >-
    Changelog entries name operations by human title ("List Bulk Job Result") rather than by
    operationId, so machine-correlating an entry to the spec requires a title-to-operationId lookup.

